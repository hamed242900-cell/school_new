{% extends 'base.html' %}{% block content %}<h2>📝 ساخت آزمون</h2><form method="post" class="card p-4 mt-3"><div class="row g-3"><div class="col-md-6"><label>عنوان آزمون</label><input name="title" class="form-control" required></div><div class="col-md-3"><label>پایه</label><input name="grade" class="form-control"></div><div class="col-md-3"><label>کلاس</label><input name="class_name" class="form-control"></div><div class="col-md-4"><label>شروع</label><input name="start_date" class="form-control" placeholder="۱۴۰۵/۰۶/۰۱"></div><div class="col-md-4"><label>پایان</label><input name="end_date" class="form-control" placeholder="۱۴۰۵/۰۶/۰۵"></div><div class="col-md-4"><label>زمان (دقیقه)</label><input name="duration_minutes" value="30" type="number" class="form-control"></div><div class="col-md-4"><label>شماره تلفن</label><select name="phone_required" class="form-select"><option value="0">اختیاری</option><option value="1">اجباری</option></select></div><div class="col-md-4"><label>در صورت اجباری بودن</label><select name="phone_target" class="form-select"><option value="student">دانش‌آموز</option><option value="father">پدر</option><option value="mother">مادر</option></select></div></div><hr><p class="text-muted">حداکثر ۵۰ سؤال. سؤال‌های چهارگزینه‌ای به‌صورت خودکار تصحیح می‌شوند.</p>{% for i in range(1,11) %}<div class="border rounded p-3 mb-3"><b>سؤال {{i}}</b><textarea name="q{{i}}" class="form-control mt-2" placeholder="متن سؤال"></textarea><div class="row g-2 mt-1"><div class="col-md-3"><input name="a{{i}}" class="form-control" placeholder="گزینه ۱"></div><div class="col-md-3"><input name="b{{i}}" class="form-control" placeholder="گزینه ۲"></div><div class="col-md-3"><input name="c{{i}}" class="form-control" placeholder="گزینه ۳"></div><div class="col-md-3"><input name="d{{i}}" class="form-control" placeholder="گزینه ۴"></div><div class="col-md-4"><select name="correct{{i}}" class="form-select"><option value="">پاسخ صحیح</option><option value="a">گزینه ۱</option><option value="b">گزینه ۲</option><option value="c">گزینه ۳</option><option value="d">گزینه ۴</option></select></div><div class="col-md-4"><input name="points{{i}}" value="1" class="form-control" placeholder="نمره"></div></div></div>{% endfor %}<button class="btn btn-success">ساخت آزمون</button></form>{% endblock %}
