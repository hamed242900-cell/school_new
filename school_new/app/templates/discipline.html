{% extends 'base.html' %}{% block content %}{% if current_role!='viewer' %}<div class="card p-4"><h3>ثبت مورد انضباطی</h3><form method="post" class="row g-2"><div class="col-md-4"><select name="student_id" class="form-select">{% for s in students %}<option value="{{s.id}}">{{s.name}} - {{s.class_name}}</option>{% endfor %}</select></div><div class="col-md-3"><input name="event_date" value="{{today}}" class="form-control"></div><div class="col-md-5"><input name="event_type" class="form-control" placeholder="نوع مورد" required></div><div class="col-md-6"><input name="action" class="form-control" placeholder="اقدام"></div><div class="col-md-6"><input name="description" class="form-control" placeholder="توضیحات"></div><button class="btn btn-primary">ثبت</button></form></div>{% endif %}<div class="card p-3 mt-3"><table class="table"><tr><th>تاریخ</th><th>نام</th><th>کلاس</th><th>نوع</th><th>توضیح</th></tr>{% for r in rows %}<tr><td>{{r.event_date|jdate}}</td><td>{{r.name}}</td><td>{{r.class_name}}</td><td>{{r.event_type}}</td><td>{{r.description}}</td></tr>{% endfor %}</table></div>{% endblock %}
