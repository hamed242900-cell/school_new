{% extends 'base.html' %}{% block content %}<h2>👥 کاربران و سطح دسترسی</h2><div class="card p-4 mt-3"><form method="post" class="row g-2"><div class="col"><input name="username" class="form-control" placeholder="نام کاربری" required></div><div class="col"><input name="password" type="password" class="form-control" placeholder="رمز" required></div><div class="col"><select name="role" class="form-select"><option value="admin">مدیر سیستم</option><option value="operator">کاربر مدرسه</option><option value="viewer">فقط مشاهده</option></select></div><div class="col"><button class="btn btn-primary">ایجاد</button></div></form></div><div class="card mt-3 p-3"><table class="table"><tr><th>کاربر</th><th>سطح</th><th>وضعیت</th><th>عملیات</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{roles[u.role]}}</td><td>{{'فعال' if u.active else 'غیرفعال'}}</td><td>{% if u.id!=session['user_id'] %}<form class="d-inline" method="post" action="{{url_for('toggle_user',uid=u.id)}}"><button class="btn btn-sm btn-warning">فعال/غیرفعال</button></form> <form class="d-inline" method="post" action="{{url_for('reset_user',uid=u.id)}}"><button class="btn btn-sm btn-secondary">بازنشانی رمز</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
