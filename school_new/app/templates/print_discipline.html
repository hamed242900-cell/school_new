<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>انضباط</title><style>body{font-family:tahoma;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #777;padding:6px}@media print{button{display:none}}</style><button onclick="print()">🖨 چاپ</button><h2>گزارش انضباطی</h2><p>تاریخ تهیه: {{today_jalali}}</p><table><tr><th>تاریخ</th><th>نام</th><th>کلاس</th><th>نوع</th><th>اقدام</th><th>توضیح</th></tr>{% for r in rows %}<tr><td>{{r.event_date|jdate}}</td><td>{{r.name}}</td><td>{{r.class_name}}</td><td>{{r.event_type}}</td><td>{{r.action}}</td><td>{{r.description}}</td></tr>{% endfor %}</table></html>
