{% extends 'base.html' %}{% block content %}<h2>⚙️ تنظیم ارسال خودکار واتساپ</h2><div class="alert alert-warning">Token را فقط در رایانه مدرسه و در اختیار مدیر نگه دارید. ارسال تجاری واتساپ ممکن است به Template تأییدشده نیاز داشته باشد.</div><form method="post" class="card p-4"><label><input type="checkbox" name="whatsapp_enabled" value="1" {% if config and config.whatsapp_enabled %}checked{% endif %}> فعال‌سازی API رسمی واتساپ</label><label class="mt-2">Access Token</label><input name="whatsapp_token" type="password" class="form-control" value="{{config.whatsapp_token if config else ''}}"><label class="mt-2">Phone Number ID</label><input name="whatsapp_phone_number_id" class="form-control" value="{{config.whatsapp_phone_number_id if config else ''}}"><label class="mt-2">API Version</label><input name="whatsapp_api_version" class="form-control" value="{{config.whatsapp_api_version if config else 'v23.0'}}"><label class="mt-2">نام Template</label><input name="whatsapp_template_name" class="form-control" value="{{config.whatsapp_template_name if config else ''}}"><label class="mt-2">زبان Template</label><input name="whatsapp_language" class="form-control" value="{{config.whatsapp_language if config else 'fa'}}"><button class="btn btn-success mt-3">ذخیره تنظیمات</button></form>{% endblock %}
