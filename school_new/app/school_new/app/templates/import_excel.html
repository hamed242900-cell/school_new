{% extends 'base.html' %}{% block content %}<h2>📥 ورود گروهی Excel</h2><div class="card p-4 mt-3"><p>ستون‌های «نام» و «کد دانش‌آموزی» الزامی‌اند. رکورد تکراری با همان کد به‌روزرسانی می‌شود.</p><a class="btn btn-outline-success mb-3" href="{{url_for('excel_template')}}">دانلود قالب Excel</a><form method="post" enctype="multipart/form-data"><input class="form-control mb-3" type="file" name="excel" accept=".xlsx,.xlsm" required><button class="btn btn-primary">ورود اطلاعات</button></form></div>{% if result %}<div class="card p-3 mt-3">جدید: {{result[0]}} | به‌روزرسانی: {{result[1]}} | خطا: {{result[2]}}</div>{% endif %}{% endblock %}
