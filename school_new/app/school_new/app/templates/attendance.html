{% extends 'base.html' %}{% block content %}<h2>🕐 حضور و غیاب</h2><form method="get" class="card p-3 my-3"><input name="day" class="form-control" value="{{day}}" placeholder="۱۴۰۵/۰۵/۱۹"><button class="btn btn-secondary mt-2">نمایش</button></form><form method="post"><input type="hidden" name="day" value="{{day}}"><div class="card overflow-auto"><table class="table"><tr><th>دانش‌آموز</th><th>کلاس</th><th>وضعیت</th></tr>{% for s in students %}<tr><td>{{s.name}}</td><td>{{s.class_name}}</td><td><select name="student_{{s.id}}" class="form-select"><option {% if statuses.get(s.id)=='حاضر' %}selected{% endif %}>حاضر</option><option {% if statuses.get(s.id)=='غایب' %}selected{% endif %}>غایب</option><option {% if statuses.get(s.id)=='تأخیر' %}selected{% endif %}>تأخیر</option></select></td></tr>{% endfor %}</table></div>{% if current_role!='viewer' %}<button class="btn btn-primary mt-3">ذخیره</button>{% endif %}</form>{% endblock %}
