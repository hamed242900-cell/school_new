{% extends 'base.html' %}{% block title %}ارسال تبریک تولد{% endblock %}{% block content %}<div class="card p-4"><h3>🎉 ارسال تبریک تولد برای {{student.name}}</h3><form method="post" action="{{url_for('send_birthday',sid=student.id)}}"><div class="row g-3"><div class="col-md-4"><label>گیرنده</label><select name="recipient" class="form-select"><option value="student">دانش‌آموز</option><option value="father">پدر</option><option value="mother">مادر</option></select></div><div class="col-md-4"><label>پیام‌رسان</label><select name="platform" class="form-select"><option value="whatsapp">واتساپ</option><option value="bale">بله</option><option value="rubika">روبیکا</option><option value="eitaa">ایتا</option></select></div><div class="col-12"><label>متن تبریک</label><textarea name="message" rows="6" class="form-control" placeholder="متن تبریک مورد نظر خود را بنویسید..."></textarea></div></div><button class="btn btn-primary mt-3">ادامه</button> <a class="btn btn-secondary mt-3" href="{{url_for('birthdays')}}">انصراف</a></form></div>{% endblock %}
