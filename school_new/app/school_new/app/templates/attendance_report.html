{% extends 'base.html' %}{% block content %}<h2>📅 گزارش غیبت</h2><form class="card p-3 my-3"><div class="row g-2"><div class="col-md-3"><label>از</label><input name="start" value="{{start}}" class="form-control"></div><div class="col-md-3"><label>تا</label><input name="end" value="{{end}}" class="form-control"></div><div class="col-md-2"><label>پایه</label><select name="grade" class="form-select"><option value="">همه</option>{% for x in grades %}<option {% if grade==x.grade %}selected{% endif %}>{{x.grade}}</option>{% endfor %}</select></div><div class="col-md-2"><label>کلاس</label><select name="class_name" class="form-select"><option value="">همه</option>{% for x in classes %}<option {% if class_name==x.class_name %}selected{% endif %}>{{x.class_name}}</option>{% endfor %}</select></div><div class="col-md-2"><label>جستجو</label><input name="q" value="{{q}}" class="form-control"></div></div><button class="btn btn-primary mt-2">نمایش</button></form><div class="card p-3"><table class="table"><tr><th>دانش‌آموز</th><th>کلاس</th><th>حاضر</th><th>غیبت</th><th>تأخیر</th><th>جزئیات</th></tr>{% for r in rows %}<tr><td>{{r.student.name}}</td><td>{{r.student.class_name}}</td><td>{{r.present}}</td><td class="text-danger">{{r.absent}}</td><td>{{r.late}}</td><td>{% for d in r.details %}{{d.att_date|jdate}}: {{d.status}}<br>{% endfor %}</td></tr>{% endfor %}</table></div>{% endblock %}
