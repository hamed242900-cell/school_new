{% extends 'base.html' %}{% block content %}<div class="card p-4 mx-auto" style="max-width:600px"><h2>🔐 ورود به آزمون: {{exam.title}}</h2>{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}<form method="post"><input type="hidden" name="step" value="login"><label>نام و نام خانوادگی</label><input name="name" class="form-control mb-2" required><label>کد ملی</label><input name="national_id" class="form-control mb-2" required><label>شماره تلفن {% if exam.phone_required %}<b class="text-danger">(اجباری)</b>{% else %}(اختیاری){% endif %}</label><input name="phone" class="form-control mb-3" {% if exam.phone_required %}required{% endif %}><button class="btn btn-primary">شروع آزمون</button></form></div>{% endblock %}
