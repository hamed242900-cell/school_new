<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>گزارش</title><style>body{font-family:tahoma;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #777;padding:6px}@media print{button{display:none}}</style><button onclick="print()">🖨 چاپ</button><h2>گزارش دانش‌آموزان</h2><p>تاریخ: {{today_jalali}}</p><table><tr><th>ردیف</th><th>نام</th><th>کد</th><th>پایه</th><th>کلاس</th><th>تماس</th><th>ولی</th></tr>{% for s in students %}<tr><td>{{loop.index}}</td><td>{{s.name}}</td><td>{{s.code}}</td><td>{{s.grade}}</td><td>{{s.class_name}}</td><td>{{s.phone}}</td><td>{{s.guardian_phone}}</td></tr>{% endfor %}</table></html>
