{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center"><h2>📝 آزمون‌های آنلاین</h2><a class="btn btn-primary" href="{{url_for('new_exam')}}">➕ ساخت آزمون</a></div><div class="card p-3 mt-3"><table class="table"><tr><th>عنوان</th><th>پایه/کلاس</th><th>سؤال</th><th>شرکت‌کننده</th><th></th></tr>{% for e in exams %}<tr><td>{{e.title}}</td><td>{{e.grade}} / {{e.class_name}}</td><td>{{e.qcount}}</td><td>{{e.acount}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('exam_detail',eid=e.id)}}">مدیریت</a></td></tr>{% else %}<tr><td colspan="5">آزمونی ثبت نشده است.</td></tr>{% endfor %}</table></div>{% endblock %}
